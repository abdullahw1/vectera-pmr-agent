"name": "Sentinel Logistics Income Fund", "date": "2025-09-16", "action": "approved", "amount": 30000000.0, "id": "f_641c51c419a0a24c", "date_id": "f_36804666902b2348", "action_id": "f_30a201c12e3a3965", "recommendation": "Approve a commitment of up to USD 30 million to a core-plus logistics strategy", "amount_id": "f_a8fc455ee68d9277"}, {"name": "Northgate Logistics Partners", "date": "2025-10-14", "action": "approved", "amount": 40000000.0, "id": "f_024f9747ea82a800", "date_id": "f_c7f914fd458e6014", "action_id": "f_7b8336c60d751713", "recommendation": "Approve a commitment of up to USD40 million to Northgate Logistics Partners", "amount_id": "f_8ac67bca467c8f56"}, {"name": "Alder Creek Multifamily Fund III", "date": "2025-11-18", "action": "withdrawn", "amount": 25000000.0, "id": "f_957442e1990f951a", "date_id": "f_7152e7649d731553", "action_id": "f_a5a61961686b2af0", "recommendation": "Withdraw the previously approved USD 25 million commitment to Alder Creek Multifamily Fund III; the Fund closed at its hard cap without an allocation to the client", "amount_id": "f_07773256cc89e5c4"}, {"name": "Ridgeline Value Fund IV", "date": "2025-11-18", "action": "approved", "amount": 25000000.0, "id": "f_56fe2135e7d842d0", "date_id": "f_acb1d33c303dcaed", "action_id": "f_20dffd8905560704", "recommendation": "Approve up to a USD25 million commitment to Ridgeline Value Fund IV", "amount_id": "f_dad58d8f40b263c0"}, {"name": "Sentinel Logistics Income Fund", "date": "2025-12-09", "action": "lapsed", "amount": 30000000.0, "id": "f_596da09c0187dd39", "date_id": "f_db1b0451c16c7a7b", "action_id": "f_f8fe906f23f7bb13", "recommendation": "Note the lapse of the previously approved USD 30 million commitment to Sentinel Logistics Income Fund; the approval expired unexercised on 30 November 2025 and is not being renewed", "amount_id": "f_b992f2f96c190398"}]}, "support": {"Cornerstone Core Property Fund": [{"text": "Three assets shaped the quarter. One Financial Plaza (Chicago office) was written down on lower submarket comparables and a near-term lease expiry. Bayfront Apartments (San Diego) was held roughly flat as concessions offset rent growth. Prairie Logistics (Kansas City) contributed positively, partially offsetting the office drag. Leverage was conservative at ~28% LTV.", "id": "f_678546ed97cf51c4"}], "Ironwood Value-Add Fund III": [{"text": "Two assets drove the result. Eastgate Industrial (Phoenix) reached stabilized occupancy and was marked up materially. Northline Logistics (Nashville) appreciated on completion of a build-to-suit. The Fund is unlevered at the fund level.", "id": "f_fee70c26166bc4f2"}], "Kestrel U.S. Real Estate Fund": [{"text": "Two assets were most relevant. Riverside Town Center (grocery-anchored retail, Sacramento) delivered stable, in-line income. Metro Apartments (Denver) appreciated modestly on rent growth. The balance of the portfolio performed in line with expectations. Leverage was ~25% LTV.", "id": "f_97c7d88ddaa94007"}], "Northgate Logistics Partners": [{"text": "Northgate Logistics Partners is a value-add industrial fund targeting the acquisition and repositioning of infill logistics and outdoor-storage assets in high-growth Sun Belt and Mountain-West markets. The strategy focuses on lease-up, mark-to-market of below-market rents, and selective development completion.", "id": "f_b5b9ce5794ad2acb"}], "Redwood Logistics Trust": [{"text": "Three assets drove the quarter. Gateway Logistics Center (Dallas) was marked up following the completion of lease-up to 97% occupancy at rents ahead of underwriting. Harbor 40 Distribution (Savannah) appreciated modestly on a new 10-year lease to an investment-grade tenant. Cedar Ridge Infill (Inland Empire) was held flat pending a planned expansion. Leverage remained conservative at approximately 31% loan-to-value.", "id": "f_8e53833fb531a012"}], "Ridgeline Value Fund IV": [{"text": "Ridgeline Value Fund IV is the fourth vintage in Ridgeline Capital's diversified value-add series, targeting the acquisition and repositioning of multifamily and mixed-use assets in supply-constrained coastal and Mountain-West metros. The strategy emphasizes operational improvement, unit renovation, and mark-to-market of below-market rents, with selective ground-up completion.", "id": "f_269bcd2482f7e88c"}], "Tidewater Distressed Realty Fund": [{"text": "The Fund is substantially wound down. A single residual position \u2014 the final tranche of a distressed retail mortgage note \u2014 remains, valued at approximately $0.11 million at quarter-end. No distributions were made during the quarter.", "id": "f_33ba243d34b9d2dc"}]}, "slides": [{"number": 1, "title": "Market Outlook \u2014 Fourth Quarter 2025", "text": ["Vectera Advisors \u2014 House View"], "id": "f_4387c6dd75bd4d47"}, {"number": 2, "title": "Key Themes", "text": ["\u2022 Core real-estate values are stabilizing after the 2023\u20132024 repricing; U.S. private funds have turned positive over the past year (see exhibits).", "\u2022 We favor industrial / logistics and multifamily, remain underweight office, and are selective in retail.", "\u2022 Leverage discipline and patient deployment into the recovery."], "id": "f_c07fe605813ccf88"}, {"number": 3, "title": "Macro & Capital Markets", "text": ["\u2022 Global macro is stabilizing; core values are recovering following the significant 2023\u20132024 repricing.", "\u2022 U.S. private real estate fund returns have moved back into positive territory over the trailing year (exhibit).", "\u2022 Cap rates have largely stabilized while the spread over Treasuries has widened, restoring the real-estate risk premium (exhibit).", "\u2022 Transaction activity is rebounding from cyclical lows as rate volatility eases and bid-ask spreads narrow.", "\u2022 We maintain leverage discipline and prefer moderate loan-to-value as financing normalizes."], "id": "f_c6a367026df1bf76"}, {"number": 4, "title": "Return Backdrop \u2014 U.S. Private Real Estate", "text": ["Trailing 3-year returns still carry the drawdown, but the latest quarter and one-year figures have turned positive."], "id": "f_1a9bbe457b9d2109"}, {"number": 5, "title": "Capital Markets \u2014 Cap Rates and Rates", "text": ["Cap rates have held broadly stable as Treasury yields settled; the spread has re-widened versus the 2024 trough."], "id": "f_468ebd0919519050"}, {"number": 6, "title": "Sector Outlook \u2014 Forecast NOI Growth", "text": ["Residential and industrial lead forecast income growth; office and retail lag across the horizon."], "id": "f_9f2fa6574add8b51"}, {"number": 7, "title": "Industrial & Logistics \u2014 Overweight", "text": ["\u2022 Our top overweight: fundamentals remain tight and rent growth is normalizing from double-digit peaks.", "\u2022 Vacancy sits well below its long-run average; new supply is moderating after a record delivery wave.", "\u2022 Focus on infill locations and outdoor / industrial storage."], "id": "f_b5a59ba851fe4267"}, {"number": 8, "title": "Residential / Multifamily \u2014 Favored", "text": ["\u2022 A widening own-versus-rent affordability gap supports durable rental demand (exhibit).", "\u2022 Record new deliveries are peaking and set to taper, easing rent pressure.", "\u2022 A key area of interest for new capital deployment."], "id": "f_ba17e2c1bef7963c"}, {"number": 9, "title": "Office \u2014 Underweight", "text": ["\u2022 Transaction cap rates have repriced sharply higher \u2014 well above appraisal marks (exhibit).", "\u2022 A pronounced bifurcation persists; only best-in-class, well-located assets are favored.", "\u2022 Leasing is improving off a low base, but the recovery is uneven."], "id": "f_c9faeb3bfbba1c4b"}, {"number": 10, "title": "Retail \u2014 Selective", "text": ["\u2022 Years of minimal new supply against steady population growth have tightened availability, especially in the Sun Belt (exhibit).", "\u2022 Grocery-anchored and necessity-based formats are favored for resilient cash flows.", "\u2022 Discretionary and enclosed-mall formats remain out of favor."], "id": "f_7906111b3af6a8d8"}, {"number": 11, "title": "Private Real Estate Debt \u2014 Opportunistic", "text": ["\u2022 Reduced bank lending has widened spreads, creating selective opportunities in senior and mezzanine credit.", "\u2022 Relevant for dedicated debt mandates; not a focus of core / value-add equity portfolios."], "id": "f_037f806a00f867b8"}, {"number": 12, "title": "Risks We Are Monitoring", "text": ["\u2022 A resurgence in rate volatility could re-widen bid-ask spreads and stall the transaction recovery.", "\u2022 Refinancing of 2020\u20132021 vintage debt at higher rates remains a sector-wide overhang, most acute in office.", "\u2022 Slower-than-expected supply absorption in select multifamily submarkets."], "id": "f_0993143bfbfcfdff"}, {"number": 13, "title": "Positioning Summary", "text": ["\u2022 Maintain leverage discipline; prefer moderate loan-to-value.", "\u2022 Tilt toward industrial / logistics and multifamily; underweight office; be selective in retail.", "\u2022 Deploy patiently into the recovery as pricing stabilizes."], "id": "f_f7fec8895394ab59"}], "charts": [{"slide": 4, "chart": 1, "asset": "assets/slide_4_chart_1.png", "id": "f_731a8525b3f7f8dc", "data": null}, {"slide": 5, "chart": 1, "asset": "assets/slide_5_chart_1.png", "id": "f_82edbc60210220b8", "data": null}, {"slide": 6, "chart": 1, "asset": "assets/slide_6_chart_1.png", "id": "f_c76e46f3cd82c67f", "data": null}, {"slide": 7, "chart": 1, "asset": "assets/slide_7_chart_1.png", "id": "f_aaa790b11e09b0c8", "data": null}, {"slide": 8, "chart": 1, "asset": "assets/slide_8_chart_1.png", "id": "f_8838ad19fd46bc56", "data": null}, {"slide": 9, "chart": 1, "asset": "assets/slide_9_chart_1.png", "id": "f_a9cf247c7c653d9c", "data": null}, {"slide": 10, "chart": 1, "asset": "assets/slide_10_chart_1.png", "id": "f_a668b1ffdb4bc05e", "data": null}], "history": [{"quarter": "1Q24", "target": 480, "nav": 372, "quarter_id": "f_736e4d7841b Secret & Confidential                                                                                   Page 2", " Portfolio Overview\n\n Cascadia Public Employees' Retirement System (\"CPERS\") retained Vectera Advisors (\"Vectera\") as investment manager\n  to invest and manage its real estate portfolio (\"Portfolio\" or \"Program\") in 2001. Vectera was awarded discretion over the\n Program beginning in 2011. Since inception, approximately $0.45 billion has been committed or approved for commitment\n across 14 individual investment positions \u2014 12 funded and carried in the flash, plus 2 approved during the Quarter that had\n not closed by Quarter-end. The funded investments have generated a since-inception net IRR of 9.2% and a 1.44x net\n equity multiple.\n CPERS has allocated 10.0% of total plan assets to real estate, with an allowable range of 5\u201320%. At Quarter-end the\n  Portfolio's net asset value was $0.44 billion, which is 8.9% of the $4.89 billion total plan and 89.4% of the $0.49 billion\n target real estate allocation. The Portfolio seeks long-term net nominal returns in excess of the CPERS Custom\n Benchmark (NCREIF ODCE, net of fees), and is diversified across property type, geography and strategy.\n The Portfolio returned 1.18% net of all fees during the Quarter and 4.69% net over the trailing one-year period, against\n 0.74% and 2.92% respectively for the benchmark.\n\n Investment Guidelines & Fund Statistics\n   Statistic                                               Value\n  Funded investments                                                             12\n  Approved, not yet closed                                                          2\n   Total committed or approved                                                 $446.8M\n  Of which funded                                                           $391.8M\n  Market value (NAV)                                                        $436.9M\n  Real estate as % of total plan assets                                             8.9%\n  NAV as % of target allocation                                                  89.4%\n   Strategic / Tactical split                                                85.2% / 14.8%\n   Since-inception net IRR                                                       9.2%\n   Since-inception equity multiple                                                         1.44x\n\n Portfolio Managers\n Marcus Ellison, Senior Managing Director  \u2022 Marcus.Ellison@vectera.com\n Priya Raman, Senior Principal  \u2022 Priya.Raman@vectera.com\n Devin Cho, Principal  \u2022 Devin.Cho@vectera.com\n Ana Reyes, Senior Analyst  \u2022 Ana.Reyes@vectera.com\n\n\n\n\n\nVectera Advisors  | Trade Secret & Confidential                                                                                   Page 3", " Annualized Time-Weighted Return\n\n         Annualized Time-Weighted Return (net, %)        I Portfolio    I CPERS Custom Benchmark\n\n         6                                                                               5.5\n                         4.7\n         4                                  2.9                                                                                                     2.5\n         2\n         0\n           -2                                                 -1.8\n           -4\n                                                                        -4.3\n\n                           1-Yr                           3-Yr                           5-Yr\n\n The Portfolio outperformed the CPERS Custom Benchmark across the one-, three- and five-year horizons shown above,\n returning 4.69% net over the trailing year against 2.92% for the benchmark.\n\n Performance Update\n\n The Portfolio generated approximately $3.3M of gross income and $2.9M of appreciation during the Quarter, resulting in a\n  total gross return of 1.41% (1.18% net of all fees). The NAV of the Portfolio was $0.44 billion at Quarter-end.\n\n Attribution \u2014 Quarterly Dollar Contribution\n  Fund                        Role                            Income        Apprec.        Fees       Contribution\n   Cornerstone Core Property       Largest contributor and largest                                                                          528,000       1,180,000     160,000        1,548,000  Fund                                individual position\n   Kestrel U.S. Real Estate Fund    Second-largest contributor                  690,000        465,000      74,000        1,081,000\n   Silverline Core-Plus Fund         Largest detractor                           185,000        (560,000)     118,000         (493,000)\n   Whitfield Diversified Property                                   Second-largest detractor                    105,000        (285,000)      64,000         (244,000)  Fund\n Cornerstone Core Property Fund was the Portfolio's largest contributor to performance during the Quarter, adding\n $1,548,000, and  it is also the Portfolio's largest individual position at $55.2M. Kestrel U.S. Real Estate Fund was the\n second-largest contributor at $1,081,000. Silverline Core-Plus Fund was the largest detractor at -$493,000, and\n Whitfield Diversified Property Fund the second-largest at -$244,000. Redwood Logistics Trust is the second-largest\n  individual position at $50.9M.\n\n\n\n\n\nVectera Advisors  | Trade Secret & Confidential                                                                                   Page 4", " Strategic Portfolio\n\n The Strategic Portfolio represented approximately 85.2% of the Portfolio's market value at Quarter-end and generated a\n 1.15% net return during the Quarter.\n Cornerstone Core Property Fund was the Portfolio's largest contributor and largest individual position. The Fund\n returned 2.87% net during the Quarter on $528,000 of income and $1,180,000 of appreciation, contributing $1,548,000. Its\n market value was $55.2M at Quarter-end and it carried 28.6% LTV.\n Three assets shaped the Quarter. Bayfront Apartments (San Diego) appreciated on rent growth and led the Fund's\n valuation gain, although concessions across the submarket remained elevated. Prairie Logistics (Kansas City) was held\n  flat. One Financial Plaza (Chicago office) was carried at its prior valuation while leasing discussions on a near-term expiry\n continued and submarket comparables began to soften. The Manager expects income to remain the principal return driver\n  into year-end.\n Beacon Diversified Property Trust returned 1.09% net during the Quarter, with a market value of $44.5M and 28.3% LTV.\n Summit Multifamily Partners returned 1.44% net during the Quarter, with a market value of $48.4M and 22.4% LTV.\n Whitfield Diversified Property Fund was the Portfolio's second-largest detractor. The Fund returned -0.79% net during\n the Quarter on $105,000 of income and -$285,000 of depreciation, contributing -$244,000. Its market value was $30.7M at\n Quarter-end and it carried 50.4% LTV.\n No manager report was supplied for this Fund for the Quarter. Commentary is therefore limited to the flash-derived role,\n market value, return and dollar contribution above; no asset-level drivers are reported for the Fund this Quarter.\n Silverline Core-Plus Fund was the Portfolio's largest detractor. The Fund returned -0.97% net during the Quarter on\n $185,000 of income and -$560,000 of depreciation, contributing -$493,000. Its market value was $50.1M at Quarter-end\n and it carried 49.8% LTV.\n No manager report was supplied for this Fund for the Quarter. Commentary is therefore limited to the flash-derived role,\n market value, return and dollar contribution above; no asset-level drivers are reported for the Fund this Quarter.\n Kestrel U.S. Real Estate Fund was the Portfolio's second-largest contributor. The Fund returned 2.22% net during the\n Quarter on $690,000 of income and $465,000 of appreciation, contributing $1,081,000. Its market value was $49.5M at\n Quarter-end and it carried 25.5% LTV.\n Income again led the result, at the highest yield in the Program. Metro Apartments (Denver) was marked up following a\n successful renovation programme, and the Fund's grocery-anchored retail holdings were revalued upward on a strong\n anchor renewal. The Manager continues to favour necessity retail and well-located residential.\n Redwood Logistics Trust was the Portfolio's second-largest individual position. The Fund returned 0.97% net during the\n Quarter on $340,000 of income and $210,000 of appreciation, contributing $490,000. Its market value was $50.9M at\n Quarter-end and it carried 31.4% LTV.\n Gateway Logistics Center (Dallas) was marked up as lease-up advanced to 95% occupancy at rents ahead of underwriting.\n Cedar Ridge Infill (Inland Empire) was held flat pending a planned expansion. The Manager notes that rent growth is\n normalising from record highs but that infill supply remains tight.\n Harborview Industrial Fund returned 1.67% net during the Quarter, with a market value of $43.1M and 44.8% LTV.\n\n\n\n\n\nVectera Advisors  | Trade Secret & Confidential                                                                                   Page 5", " Tactical and Special Situations Portfolio\n\n The Tactical and Special Situations  Portfolio represented approximately 14.8%  of the  Portfolio's market value  at\n Quarter-end and generated a 1.33% net return during the Quarter.\n Tidewater Distressed Realty Fund returned 1.47% net during the Quarter, with a market value of $0.1M and 0.0% LTV.\n Ironwood Value-Add Fund III returned 4.81% net during the Quarter, with a market value of $10.2M and 0.0% LTV.\n Meridian Opportunity Fund V returned 0.31% net during the Quarter, with a market value of $30.7M and 42.6% LTV.\n Blackford Special Situations Fund II returned 1.20% net during the Quarter, with a market value of $23.5M and 49.1% LTV.\n\n\n\n\n\nVectera Advisors  | Trade Secret & Confidential                                                                                   Page 6", " Recent Investment Activity\n\n During the Quarter the Investment Committee approved 2 new commitments for CPERS. Neither had closed or funded by\n Quarter-end; accordingly they are reflected here as new investment activity rather than in funded holdings or performance.\n\n Sentinel Logistics Income Fund \u2014 $30.0M, approved September 2025\n Sentinel Logistics Income Fund is a core-plus logistics strategy targeting stabilised distribution assets in primary inland-port\n markets, with return weighted toward current income.\n\n Alder Creek Multifamily Fund III \u2014 $25.0M, approved August 2025\n Alder Creek Multifamily Fund III is the third vintage in Alder Creek's residential series, acquiring and renovating mid-market\n garden apartments in supply-constrained Mountain-West metros.\n Market Update\n\n Core values continued to stabilise during the Quarter following the 2023\u20132024 repricing. U.S. private real estate funds\n returned +0.8% in the latest quarter and +2.6% over the trailing year, against \u22123.1% annualised over three years as the\n drawdown continues to roll out of the medium-term record. The Portfolio's 1.18% net quarter sits above the market's\n +0.8%.\n Capital markets continued to repair. The NPI valuation-weighted cap rate held broadly stable at ~4.6% while the 10-year\n Treasury held at ~4.2%, keeping the spread wider than its 2024 trough. Office remains the outlier: transaction cap rates of\n ~6.3%  still price above appraisal marks of ~5.6%, and although that gap narrowed during the Quarter we continue to\n recommend caution on the sector.\n Forecast NOI growth favours residential (1.5% p.a.) and industrial (1.4%), with office (0.5%) and retail (0.3%) trailing.\n  Industrial has returned 3.9% over one year and 10.6% annualised over five. That positioning is consistent with the\n  Portfolio's largest property exposure, Industrial at 35.4%, and its 22.9% apartment weighting. Risks we monitor include\n renewed rate volatility, refinancing pressure on 2020\u20132021 vintage debt, and slower absorption in selected multifamily\n submarkets.\n\n  Market figures above are drawn from the house-view deck's exhibits and describe broad market indices. They are not the CPERS Custom\n Benchmark, which is a distinct client-specific series and is the basis for the return-objective test; the two are related but not interchangeable.\n\n\n\n\n\nVectera Advisors  | Trade Secret & Confidential                                                                                   Page 7", " Allocation Over Time\n\n The Portfolio's net asset value has grown steadily over the period shown, while the target allocation has moved with total\n plan assets, reaching $436.9M at Quarter-end against a target of $488.9M.\n\n          Target Allocation vs Net Asset Value ($MM)   I Target allocation     I NAV\n\n        520\n\n        480\n\n        440\n\n        400\n\n        360\n\n        320\n                1Q24        2Q24        3Q24        4Q24        1Q25        2Q25        3Q25\n\n\n\n\n\nVectera Advisors  | Trade Secret & Confidential                                                                                   Page 8", " Diversification\n\n      Property Type Diversification\n\n                                                    Apartment \u2014 22.9%\n                                                             Office \u2014 8.4%\n                                                                  Industrial \u2014 35.4%\n                                                               Retail \u2014 8.4%\n                                                         Hotel \u2014 1.3%\n                                                     Other \u2014 23.5%\n\n\n\n\n\n     Geographic Diversification (% of market value)\n\n                          Pacific                                                                    17.2%\n\n                   Southeast  for Cascadia Public Employees'\n Retirement System and is intended for the exclusive and confidential use of CPERS and its authorized representatives.\n Performance results are presented net of investment management fees, incentive allocations and fund-level expenses\n unless otherwise indicated, and reflect the reinvestment of income. Returns for periods of one year or less are not\n annualized. Time-weighted returns (TWR) are calculated using a Modified Dietz methodology; since-inception internal\n rates of return (IRR) and equity multiples are money-weighted and reflect the timing and magnitude of capital flows. Market\n values are based on the most recent valuations reported by underlying fund managers and may reflect appraised rather\n than transaction values. Past performance is not indicative of future results. All figures in this report are synthetic and were\n created solely for an evaluation exercise.\n\n\n\n\n\nVectera Advisors  | Trade Secret & Confidential                                                                                  Page 10", " Appendix A: Quarterly Flash Report\n\n The exhibits below are the Third Quarter 2025 quarterly flash from which every figure in this report is derived.\n\n Portfolio Composition\n   Total Plan Assets        Target Allocation        Market Value           Unfunded             Remaining\n           $4,889,213,650            $488,921,365            $436,859,357               $7,585,950             $52,062,008\n\n Performance Summary (%)\n                              Quarter GRS   Quarter NET   1 Yr GRS      1 Yr NET      3 Yr GRS      3 Yr NET      5 Yr GRS\n  CPERS Portfolio                  1.41%        1.18%        5.98%        4.69%        -0.75%        -1.76%        7.21%\n\n Investment Schedule\n\n   Investment                            Vintage  Commitment      Funded          Unfunded       Returned          Market Value    % NAV\n   Cornerstone Core Property Fund           2010        $40,000,000  against 0.70% and 2.66%, respectively, for the CPERS Custom Benchmark.", "evidence": ["f_73d7a6957dee7886", "f_4de703a004dd4240", "f_fbb602a3f9ac4652", "f_50643cfbd0a5a476", "f_10a88430f35664c4"]}]}, {"title": "Investment Guidelines & Fund Statistics", "blocks": [{"type": "paragraph", "text": "The policy allocation to real estate is 10% of total plan assets, with an allowable range of 5-20%. The return objective is to exceed the CPERS Custom Benchmark.", "evidence": ["f_c4a35056612b5b2a", "f_10a88430f35664c4"]}, {"type": "table", "columns": ["Statistic", "Value"], "rows": [["Funded investments", "12"], ["Approved, not yet funded", "2"], ["Total committed or approved", "$456.8M"], ["Flash commitment total", "$391.8M"], ["Market value (NAV)", "$436.1M"], ["Real estate as % of plan assets", "8.8%"], ["NAV as % of target", "88.0%"], ["Strategic / Tactical split", "85.0% / 15.0%"], ["Since-inception net IRR", "9.3%"], ["Since-inception net equity multiple", "1.45x"]], "evidence": ["f_928ae5d68f836b1e", "f_de7c757bcb0e863a", "f_d2923007900e6ba4", "f_e9f7ee8c6d090d70", "f_733e3254aca0668a", "f_3cf2c4fd856194c6", "f_c07ad303d5a48c7c", "f_f4018abf04e42e63", "f_73d7a6957dee7886", "f_4de703a004dd4240", "f_4cb6f0987417f0d4", "f_ecfb7f29c8201a41", "f_fb639ccbb3c83666", "f_e3d49688999ee127", "f_af97020109dacac8", "f_9792b2b8c2c37934", "f_22884a114aee46dc", "f_d32bd814245da843", "f_a52e003492f0492b", "f_10a88430f35664c4", "f_fbb602a3f9ac4652", "f_50643cfbd0a5a476", "f_4b312de946cdf35a", "f_ef74f88d8498a8b1", "f_73baf9443bcea568", "f_d70bce785a12db03", "f_7763c7aba4b49024", "f_0b38330db80c6de6", "f_1ddbfa65c04644d2", "f_69afbc35654a0ded", "f_205a258010db4f8a", "f_05b59e99389849b8", "f_d2c5a1b09abbd5ee", "f_a28ed47ef16e42a6", "f_2d8e82fff98516f3", "f_cbdb4277c0a67314", "f_c14e046778ff1105", "f_7e76b74a96a1f345", "f_9ec6e048945507c2", "f_024f9747ea82a800", "f_56fe2135e7d842d0", "f_9f049bd0c6121180"]}]}, {"title": "Portfolio Managers", "blocks": [{"type": "paragraph", "text": "Marcus Ellison, Senior Managing Director \u2022 Marcus.Ellison@vectera.com", "evidence": ["f_db592f2cc078d7b2"]}, {"type": "paragraph", "text": "Priya Raman, Senior Principal \u2022 Priya.Raman@vectera.com", "evidence": ["f_db592f2cc078d7b2"]}, {"type": "paragraph", "text": "Devin Cho, Principal \u2022 Devin.Cho@vectera.com", "evidence": ["f_db592f2cc078d7b2"]}, {"type": "paragraph", "text": "Ana Reyes, Senior Analyst \u2022 Ana.Reyes@vectera.com", "evidence": ["f_db592f2cc078d7b2"]}]}, {"title": "Annualized Time-Weighted Return", "blocks": [{"type": "chart", "kind": "annual", "evidence": ["f_b7249d47a85f8561", "f_50643cfbd0a5a476", "f_a2503e4b4b44afae", "f_fad071c54e190432", "f_cba39cbde2af615c", "f_76dc96a3213c198d"]}, {"type": "paragraph", "text": "The chart compares the Portfolio's net time-weighted returns with the CPERS Custom Benchmark. Returns are read from the annual returns exhibit, not calculated from fund cash flows.", "evidence": ["f_10a88430f35664c4"]}]}, {"title": "Performance Update", "blocks": [{"type": "paragraph", "text": "The Portfolio generated $3.3M of gross income and $3.3M of appreciation. Manager fees were $1.1M. The quarter's return was 1.52% gross and 1.28% net.", "evidence": ["f_4cb6f0987417f0d4", "f_fb639ccbb3c83666", "f_ecfb7f29c8201a41", "f_f4018abf04e42e63", "f_73d7a6957dee7886"]}, {"type": "table", "columns": ["Fund", "Role", "Income", "Apprec.", "Fees", "Contribution"], "rows": [["Redwood Logistics Trust", "largest contributor; second-largest individual position", "346,623.46", "1,081,768.36", "61,356.27", "1,367,035.55"], ["Ironwood Value-Add Fund III", "second-largest contributor", "125,530.00", "942,909.00", "32,150.00", "1,036,289.00"], ["Cornerstone Core Property Fund", "second-largest detractor; largest individual position", "534,034.90", "-557,954.40", "163,256.86", "-187,176.36"], ["Meridian Opportunity Fund V", "largest detractor", "-31,854.07", "-468,729.81", "-31,290.15", "-469,293.73"]], "evidence": ["f_a28ed47ef16e42a6", "f_3a81bda6aeb96760", "f_d56742ed447d75d0", "f_eefa57ab793d3feb", "f_a6e60242597d2abe", "f_dfeb0a03cb677d9c", "f_c14e046778ff1105", "f_822ed5d5481e08e7", "f_b121b0d5585bbe60", "f_3a68a53a7dbe100e", "f_a3530c1160075f8c", "f_62a2c0b3dea9dccd", "f_0b38330db80c6de6", "f_aa4f8e356bbd6ea7", "f_1cf58d6da0f65a9b", "f_fc99de377c2e2f69", "f_67ad5fe9f0e9e3de", "f_92f49b852eba08e5", "f_7e76b74a96a1f345", "f_9a9a210983fa6543", "f_15b0422df462d7e6", "f_c7f51e7ae34b3487", "f_7b22b8ca5102af73", "f_9df9d367ceb65abc"]}, {"type": "paragraph", "text": "The quarterly net return changed from 1.18% in the prior report to 1.28%, a change of +10.4 basis points, using the prior report's displayed precision.", "evidence": ["f_e6ee09be84553a2b", "f_73d7a6957dee7886", "f_6a43a030f68485b1"]}]}, {"title": "Strategic Portfolio", "blocks": [{"type": "paragraph", "text": "The Strategic sleeve represented 85.0% of portfolio market value and returned 1.16% net during the quarter.", "evidence": ["f_8c9121834733ae67", "f_2f0e1689715853f4"]}, {"type": "paragraph", "text": "Cornerstone Core Property Fund was the Portfolio's second-largest detractor and largest individual position. The Fund returned -0.34% net, with quarter-end NAV of $54.4M and 28.2% LTV. Income of $534,034.90, appreciation of -$557,954.40 and fees of $163,256.86 resulted in a -$187,176.36 dollar contribution.", "evidence": ["f_0b38330db80c6de6", "f_aa4f8e356bbd6ea7", "f_36950c41dea9233d", "f_f50151e82610d9ca", "f_257a8862881bdb5f", "f_1cf58d6da0f65a9b", "f_fc99de377c2e2f69", "f_67ad5fe9f0e9e3de", "f_92f49b852eba08e5"]}, {"type": "paragraph", "text": "Three assets shaped the quarter. One Financial Plaza (Chicago office) was written down on lower submarket comparables and a near-term lease expiry. Bayfront Apartments (San Diego) was held roughly flat as concessions offset rent growth. Prairie Logistics (Kansas City) contributed positively, partially offsetting the office drag. Leverage was conservative at ~28% LTV.", "evidence": ["f_678546ed97cf51c4"]}, {"type": "paragraph", "text": "Beacon Diversified Property Trust. The Fund returned 1.12% net, with quarter-end NAV of $41.9M and 28.0% LTV.", "evidence": ["f_1ddbfa65c04644d2", "f_18af08d65f5ce457", "f_2db7399f42bf208f", "f_128dd2b3a0bbce27", "f_eadd47f1b6f5e59c"]}, {"type": "paragraph", "text": "Summit Multifamily Partners. The Fund returned 1.22% net, with quarter-end NAV of $48.6M and 22.2% LTV.", "evidence": ["f_69afbc35654a0ded", "f_18af08d65f5ce457", "f_bf989cb2a07ac867", "f_b1fceaf9f67defc1", "f_5e5d896feb7b843f"]}, {"type": "paragraph", "text": "Whitfield Diversified Property Fund. The Fund returned 1.04% net, with quarter-end NAV of $30.8M and 50.0% LTV.", "evidence": ["f_205a258010db4f8a", "f_18af08d65f5ce457", "f_838fd8afbb04bcdd", "f_62601802ad62e13d", "f_cc1a8bade3fa64a8"]}, {"type": "paragraph", "text": "Silverline Core-Plus Fund. The Fund returned 0.75% net, with quarter-end NAV of $50.2M and 49.3% LTV.", "evidence": ["f_05b59e99389849b8", "f_18af08d65f5ce457", "f_9851ee8df2cab49a", "f_61ae7464721b5cca", "f_d73cd590256c7309"]}, {"type": "paragraph", "text": "Kestrel U.S. Real Estate Fund. The Fund returned 1.66% net, with quarter-end NAV of $49.7M and 25.3% LTV.", "evidence": ["f_d2c5a1b09abbd5ee", "f_18af08d65f5ce457", "f_32a888fa2a5cba5b", "f_145359c1a7c2b331", "f_3f0ea1fcdea98869"]}, {"type": "paragraph", "text": "Redwood Logistics Trust was the Portfolio's largest contributor and second-largest individual position. The Fund returned 2.69% net, with quarter-end NAV of $51.9M and 31.2% LTV. Income of $346,623.46, appreciation of $1,081,768.36 and fees of $61,356.27 resulted in a $1,367,035.55 dollar contribution.", "evidence": ["f_a28ed47ef16e42a6", "f_3a81bda6aeb96760", "f_2eb9a401a652eda3", "f_32c7b35d93ba4163", "f_f9b7514f361cc84e", "f_d56742ed447d75d0", "f_eefa57ab793d3feb", "f_a6e60242597d2abe", "f_dfeb0a03cb677d9c"]}, {"type": "paragraph", "text": "Three assets drove the quarter. Gateway Logistics Center (Dallas) was marked up following the completion of lease-up to 97% occupancy at rents ahead of underwriting. Harbor 40 Distribution (Savannah) appreciated modestly on a new 10-year lease to an investment-grade tenant. Cedar Ridge Infill (Inland Empire) was held flat pending a planned expansion. Leverage remained conservative at approximately 31% loan-to-value.", "evidence": ["f_8e53833fb531a012"]}, {"type": "paragraph", "text": "Harborview Industrial Fund. The Fund returned 1.31% net, with quarter-end NAV of $43.3M and 44.5% LTV.", "evidence": ["f_2d8e82fff98516f3", "f_18af08d65f5ce457", "f_10ad4a943fecf9f8", "f_84b4f5105c54dc61", "f_488ac0cd1fc48bc0"]}]}, {"title": "Tactical and Special Situations Portfolio", "blocks": [{"type": "paragraph", "text": "The Tactical sleeve represented 15.0% of portfolio market value and returned 2.02% net during the quarter.", "evidence": ["f_79b29bb3ce376b6e", "f_4f89f3e0004ba6d1"]}, {"type": "paragraph", "text": "Tidewater Distressed Realty Fund. The Fund had no quarterly net return reported in the flash, with quarter-end NAV of $0.1M and 0.0% LTV.", "evidence": ["f_cbdb4277c0a67314", "f_18af08d65f5ce457", "f_65bb4c68a4aeb173", "f_dd0a9bd56c837039"]}, {"type": "paragraph", "text": "Ironwood Value-Add Fund III was the Portfolio's second-largest contributor. The Fund returned 10.22% net, with quarter-end NAV of $11.1M and 0.0% LTV. Income of $125,530.00, appreciation of $942,909.00 and fees of $32,150.00 resulted in a $1,036,289.00 dollar contribution.", "evidence": ["f_c14e046778ff1105", "f_822ed5d5481e08e7", "f_17922cdd1a43e3b2", "f_6e2eb4d8c867a684", "f_8b6601fb90b16065", "f_b121b0d5585bbe60", "f_3a68a53a7dbe100e", "f_a3530c1160075f8c", "f_62a2c0b3dea9dccd"]}, {"type": "paragraph", "text": "Two assets drove the result. Eastgate Industrial (Phoenix) reached stabilized occupancy and was marked up materially. Northline Logistics (Nashville) appreciated on completion of a build-to-suit. The Fund is unlevered at the fund level.", "evidence": ["f_fee70c26166bc4f2"]}, {"type": "paragraph", "text": "Meridian Opportunity Fund V was the Portfolio's largest detractor. The Fund returned -1.53% net, with quarter-end NAV of $30.2M and 42.2% LTV. Income of -$31,854.07, appreciation of -$468,729.81 and fees of -$31,290.15 resulted in a -$469,293.73 dollar contribution.", "evidence": ["f_7e76b74a96a1f345", "f_9a9a210983fa6543", "f_38c09d05464d04cf", "f_32121b05c291a735", "f_21bd50c4da48af1f", "f_15b0422df462d7e6", "f_c7f51e7ae34b3487", "f_7b22b8ca5102af73", "f_9df9d367ceb65abc"]}, {"type": "paragraph", "text": "No current manager report was supplied for this fund. Commentary is limited to verified flash figures; asset-level drivers are unavailable.", "evidence": ["f_7e76b74a96a1f345"]}, {"type": "paragraph", "text": "Blackford Special Situations Fund II. The Fund returned 3.13% net, with quarter-end NAV of $23.8M and 49.7% LTV.", "evidence": ["f_9ec6e048945507c2", "f_18af08d65f5ce457", "f_fd017d9c584e3f66", "f_48937beba85a45f6", "f_3dc1d66df53f7faa"]}]}, {"title": "Recent Investment Activity", "blocks": [{"type": "paragraph", "text": "The Investment Committee approved 2 new commitments for CPERS during the quarter.", "evidence": ["f_024f9747ea82a800", "f_56fe2135e7d842d0"]}, {"type": "paragraph", "text": "Northgate Logistics Partners - $40.0M, approved 2025-10-14.", "evidence": ["f_024f9747ea82a800", "f_8ac67bca467c8f56", "f_c7f914fd458e6014", "f_7b8336c60d751713"]}, {"type": "paragraph", "text": "The approval remained open and was not carried as a funded holding at quarter-end. No performance figures are assigned to this commitment.", "evidence": ["f_024f9747ea82a800", "f_7b8336c60d751713", "f_0b38330db80c6de6", "f_1ddbfa65c04644d2", "f_69afbc35654a0ded", "f_205a258010db4f8a", "f_05b59e99389849b8", "f_d2c5a1b09abbd5ee", "f_a28ed47ef16e42a6", "f_2d8e82fff98516f3", "f_cbdb4277c0a67314", "f_c14e046778ff1105", "f_7e76b74a96a1f345", "f_9ec6e048945507c2"]}, {"type": "paragraph", "text": "Northgate Logistics Partners is a value-add industrial fund targeting the acquisition and repositioning of infill logistics and outdoor-storage assets in high-growth Sun Belt and Mountain-West markets. The strategy focuses on lease-up, mark-to-market of below-market rents, and selective development completion.", "evidence": ["f_b5b9ce5794ad2acb"]}, {"type": "paragraph", "text": "Ridgeline Value Fund IV - $25.0M, approved 2025-11-18.", "evidence": ["f_56fe2135e7d842d0", "f_dad58d8f40b263c0", "f_acb1d33c303dcaed", "f_20dffd8905560704"]}, {"type": "paragraph", "text": "The approval remained open and was not carried as a funded holding at quarter-end. No performance figures are assigned to this commitment.", "evidence": ["f_56fe2135e7d842d0", "f_20dffd8905560704", "f_0b38330db80c6de6", "f_1ddbfa65c04644d2", "f_69afbc35654a0ded", "f_205a258010db4f8a", "f_05b59e99389849b8", "f_d2c5a1b09abbd5ee", "f_a28ed47ef16e42a6", "f_2d8e82fff98516f3", "f_cbdb4277c0a67314", "f_c14e046778ff1105", "f_7e76b74a96a1f345", "f_9ec6e048945507c2"]}, {"type": "paragraph", "text": "Ridgeline Value Fund IV is the fourth vintage in Ridgeline Capital's diversified value-add series, targeting the acquisition and repositioning of multifamily and mixed-use assets in supply-constrained coastal and Mountain-West metros. The strategy emphasizes operational improvement, unit renovation, and mark-to-market of below-market rents, with selective ground-up completion.", "evidence": ["f_269bcd2482f7e88c"]}, {"type": "paragraph", "text": "The previously approved $25.0M commitment to Alder Creek Multifamily Fund III was withdrawn during the quarter. The Fund closed at its hard cap without an allocation to the client.", "evidence": ["f_957442e1990f951a", "f_07773256cc89e5c4", "f_a5a61961686b2af0"]}, {"type": "paragraph", "text": "The previously approved $30.0M commitment to Sentinel Logistics Income Fund lapsed during the quarter. The approval expired unexercised on 30 November 2025 and is not being renewed.", "evidence": ["f_596da09c0187dd39", "f_b992f2f96c190398", "f_f8fe906f23f7bb13"]}]}, {"title": "Market Update", "blocks": [{"type": "paragraph", "text": "Core real-estate values are stabilizing after the 2023\u20132024 repricing; U.S. private funds have turned positive over the past year (see exhibits). We favor industrial / logistics and multifamily, remain underweight office, and are selective in retail. Leverage discipline and patient deployment into the recovery.", "evidence": ["f_c07fe605813ccf88"]}, {"type": "paragraph", "text": "A resurgence in rate volatility could re-widen bid-ask spreads and stall the transaction recovery. Refinancing of 2020\u20132021 vintage debt at higher rates remains a sector-wide overhang, most acute in office. Slower-than-expected supply absorption in select multifamily submarkets.", "evidence": ["f_0993143bfbfcfdff"]}, {"type": "paragraph", "text": "Maintain leverage discipline; prefer moderate loan-to-value. Tilt toward industrial / logistics and multifamily; underweight office; be selective in retail. Deploy patiently into the recovery as pricing stabilizes.", "evidence": ["f_f7fec8895394ab59"]}, {"type": "paragraph", "text": "Quantitative chart-image extraction is unavailable in this run. The house-view chart images are retained in the review package for inspection; no pixel values have been guessed.", "evidence": []}, {"type": "paragraph", "text": "House-view market indices and the CPERS Custom Benchmark are distinct series. The client benchmark is used for performance comparison and the return-objective test.", "evidence": ["f_10a88430f35664c4"]}]}, {"title": "Allocation Over Time", "blocks": [{"type": "chart", "kind": "allocation", "evidence": ["f_736e4d7841ba51c9", "f_7b277517172cfec8", "f_5eb3a93d041ba495", "f_67f474c375399be3", "f_36562237ba82512e", "f_c447f8ccd5c82b48", "f_ddb79e4bfab62bdd", "f_2b1beddb5c5c1bd8", "f_4ae169b745498bc8", "f_a00d31e6d85d6946", "f_14b98dedc889d641", "f_cdbe05adc2d7a899", "f_d5c2807196c01177", "f_1b3771758491c514", "f_d9e6fb8af87b6f3b", "f_589f8faa10a otals, rather than averaging individual fund ratios.", "evidence": ["f_f7d354bc01a1e7da", "f_ad7a7d98b5a97ea6"]}]}, {"title": "Disclosure Statements", "blocks": [{"type": "paragraph", "text": "This Performance Measurement Report has been prepared by Vectera Advisors solely for Cascadia Public Employees' Retirement System and is intended for the exclusive and confidential use of CPERS and its authorized representatives. Performance results are presented net of investment management fees, incentive allocations and fund-level expenses unless otherwise indicated, and reflect the reinvestment of income. Returns for periods of one year or less are not annualized. Time-weighted returns (TWR) are calculated using a Modified Dietz methodology; since-inception internal rates of return (IRR) and equity multiples are money-weighted and reflect the timing and magnitude of capital flows. Market values are based on the most recent valuations reported by underlying fund managers and may reflect appraised rather than transaction values. Past performance is not indicative of future results. All figures in this report are synthetic and were created solely for an evaluation exercise.", "evidence": ["f_83b5c6d2613c7074"]}]}, {"title": "Appendix A: Quarterly Flash Report", "blocks": [{"type": "paragraph", "text": "The following pages reproduce the current quarter's supplied flash PDF. The workbook remains the authoritative source for portfolio calculations.", "evidence": []}]}], "ledger": {"facts": {"f_928ae5d68f836b1e": {"value": "Cascadia Public Employees' Retirement System", "source": {"file": "flash_4Q25.xlsx", "sheet": "FundingStatus(Agg)", "cell": "A1"}}, "f_de7c757bcb0e863a": {"value": 436116069.16, "source": {"file": "flash_4Q25.xlsx", "sheet": "FundingStatus(Agg)", "cell": "G33"}}, "f_d2923007900e6ba4": {"value": 391814526.42, "source": {"file": "flash_4Q25.xlsx", "sheet": "FundingStatus(Agg)", "cell": "C33"}}, "f_e9f7ee8c6d090d70": {"value": 475455390.03, "source": {"file": "fl les and a near-term lease expiry. Bayfront Apartments (San Diego) was held roughly flat as concessions offset rent growth. Prairie Logistics (Kansas City) contributed positively, partially offsetting the office drag. Leverage was conservative at ~28% LTV.", "source": {"file": "manager_reports/cornerstone_core_property_fund_4Q25.pdf", "page": 1, "quote": "Three assets shaped the quarter. One Financial Plaza (Chicago office) was written down on lower submarket comparables and a near-term lease expiry. Bayfront Apartments (San Diego) was held roughly flat as concessions offset rent growth. Prairie Logistics (Kansas City) contributed positively, partially offsetting the office drag. Leverage was conservative at ~28% LTV.", "method": "heading-delimited extraction"}}, "f_fee70c26166bc4f2": {"value": "Two assets drove the result. Eastgate Industrial (Phoenix) reached stabilized occupancy and was marked up materially. Northline Logistics (Nashville) appreciated on completion of a build-to-suit. The Fund is unlevered at the fund level.", "source": {"file": "manager_reports/ironwood_value_add_fund_3_4Q25.pdf", "page": 1, "quote": "Two assets drove the result. Eastgate Industrial (Phoenix) reached stabilized occupancy and was marked up materially. Northline Logistics (Nashville) appreciated on completion of a build-to-suit. The Fund is unlevered at the fund level.", "method": "heading-delimited extraction"}}, "f_97c7d88ddaa94007": {"value": "Two assets were most relevant. Riverside Town Center (grocery-anchored retail, Sacramento) delivered stable, in-line income. Metro Apartments (Denver) appreciated modestly on rent growth. The balance of the portfolio performed in line with expectations. Leverage was ~25% LTV.", "source": {"file": "manager_reports/kestrel_us_real_estate_fund_4Q25.pdf", "page": 1, "quote": "Two assets were most relevant. Riverside Town Center (grocery-anchored retail, Sacramento) delivered stable, in-line income. Metro Apartments (Denver) appreciated modestly on rent growth. The balance of the portfolio performed in line with expectations. Leverage was ~25% LTV.", "method": "heading-delimited extraction"}}, "f_b5b9ce5794ad2acb": {"value": "Northgate Logistics Partners is a value-add industrial fund targeting the acquisition and repositioning of infill logistics and outdoor-storage assets in high-growth Sun Belt and Mountain-West markets. The strategy focuses on lease-up, mark-to-market of below-market rents, and selective development completion.", "source": {"file": "manager_reports/northgate_logistics_partners_4Q25.pdf", "page": 1, "quote": "Northgate Logistics Partners is a value-add industrial fund targeting the acquisition and repositioning of infill logistics and outdoor-storage assets in high-growth Sun Belt and Mountain-West markets. The strategy focuses on lease-up, mark-to-market of below-market rents, and selective development completion.", "method": "heading-delimited extraction"}}, "f_8e53833fb531a012": {"value": "Three assets drove the quarter. Gateway Logistics Center (Dallas) was marked up following the completion of lease-up to 97% occupancy at rents ahead of underwriting. Harbor 40 Distribution (Savannah) appreciated modestly on a new 10-year lease to an investment-grade tenant. Cedar Ridge Infill (Inland Empire) was held flat pending a planned expansion. Leverage remained conservative at approximately 31% loan-to-value.", "source": {"file": "manager_reports/redwood_logistics_trust_4Q25.pdf", "page": 1, "quote": "Three assets drove the quarter. Gateway Logistics Center (Dallas) was marked up following the completion of lease-up to 97% occupancy at rents ahead of underwriting. Harbor 40 Distribution (Savannah) appreciated modestly on a new 10-year lease to an investment-grade tenant. Cedar Ridge Infill (Inland Empire) was held flat pending a planned expansion. Leverage remained conservative at approximately 31% loan-to-value.", "method": "heading-delimited extraction"}}, "f_269bcd2482f7e88c": {"value": "Ridgeline Value Fund IV is the fourth vintage in Ridgeline Capital's diversified value-add series, targeting the acquisition and repositioning of multifamily and mixed-use assets in supply-constrained coastal and Mountain-West metros. The strategy emphasizes operational improvement, unit renovation, and mark-to-market of below-market rents, with selective ground-up completion.", "source": {"file": "manager_reports/ridgeline_value_fund_iv_4Q25.pdf", "page": 1, "quote": "Ridgeline Value Fund IV is the fourth vintage in Ridgeline Capital's diversified value-add series, targeting the acquisition and repositioning of multifamily and mixed-use assets in supply-constrained coastal and Mountain-West metros. The strategy emphasizes operational improvement, unit renovation, and mark-to-market of below-market rents, with selective ground-up completion.", "method": "heading-delimited extraction"}}, "f_33ba243d34b9d2dc": {"value": "The Fund is substantially wound down. A single residual position \u2014 the final tranche of a distressed retail mortgage note \u2014 remains, valued at approximately $0.11 million at quarter-end. No distributions were made during the quarter.", "source": {"file": "manager_reports/tidewater_distressed_realty_fund_4Q25.pdf", "page": 1, "quote": "The Fund is substantially wound down. A single residual position \u2014 the final tranche of a distressed retail mortgage note \u2014 remains, valued at approximately $0.11 million at quarter-end. No distributions were made during the quarter.", "method": "heading-delimited extraction"}}, "f_4387c6dd75bd4d47": {"value": ["Market Outlook \u2014 Fourth Quarter 2025", "Vectera Advisors \u2014 House View"], "source": {"file": "market_outlook_4Q25.pptx", "slide": 1}}, "f_c07fe605813ccf88": {"value": ["Key Themes", "\u2022 Core real-estate values are stabilizing after the 2023\u20132024 repricing; U.S. private funds have turned positive over the past year (see exhibits).", "\u2022 We favor industrial / logistics and multifamily, remain underweight office, and are selective in retail.", "\u2022 Leverage discipline and patient deployment into the recovery."], "source": {"file": "market_outlook_4Q25.pptx", "slide": 2}}, "f_c6a367026df1bf76": {"value": ["Macro & Capital Markets", "\u2022 Global macro is stabilizing; core values are recovering following the significant 2023\u20132024 repricing.", "\u2022 U.S. private real estate fund returns have moved back into positive territory over the trailing year (exhibit).", "\u2022 Cap rates have largely stabilized while the spread over Treasuries has widened, restoring the real-estate risk premium (exhibit).", "\u2022 Transaction activity is rebounding from cyclical lows as rate volatility eases and bid-ask spreads narrow.", "\u2022 We maintain leverage discipline and prefer moderate loan-to-value as financing normalizes."], "source": {"file": "market_outlook_4Q25.pptx", "slide": 3}}, "f_1a9bbe457b9d2109": {"value": ["Return Backdrop \u2014 U.S. Private Real Estate", "Trailing 3-year returns still carry the drawdown, but the latest quarter and one-year figures have turned positive."], "source": {"file": "market_outlook_4Q25.pptx", "slide": 4}}, "f_731a8525b3f7f8dc": {"value": null, "source": {"file": "market_outlook_4Q25.pptx", "slide": 4, "chart": 1, "asset": "assets/slide_4_chart_1.png", "method": "model vision", "requires_review": true}}, "f_468ebd0919519050": {"value": ["Capital Markets \u2014 Cap Rates and Rates", "Cap rates have held broadly stable as Treasury yields settled; the spread has re-widened versus the 2024 trough."], "source": {"file": "market_outlook_4Q25.pptx", "slide": 5}}, "f_82edbc60210220b8": {"value": null, "source": {"file": "market_outlook_4Q25.pptx", "slide": 5, "chart": 1, "asset": "assets/slide_5_chart_1.png", "method": "model vision", "requires_review": true}}, "f_9f2fa6574add8b51": {"value": ["Sector Outlook \u2014 Forecast NOI Growth", "Residential and industrial lead forecast income growth; office and retail lag across the horizon."], "source": {"file": "market_outlook_4Q25.pptx", "slide": 6}}, "f_c76e46f3cd82c67f": {"value": null, "source": {"file": "market_outlook_4Q25.pptx", "slide": 6, "chart": 1, "asset": "assets/slide_6_chart_1.png", "method": "model vision", "requires_review": true}}, "f_b5a59ba851fe4267": {"value": ["Industrial & Logistics \u2014 Overweight", "\u2022 Our top overweight: fundamentals remain tight and rent growth is normalizing from double-digit peaks.", "\u2022 Vacancy sits well below its long-run average; new supply is moderating after a record delivery wave.", "\u2022 Focus on infill locations and outdoor / industrial storage."], "source": {"file": "market_outlook_4Q25.pptx", "slide": 7}}, "f_aaa790b11e09b0c8": {"value": null, "source": {"file": "market_outlook_4Q25.pptx", "slide": 7, "chart": 1, "asset": "assets/slide_7_chart_1.png", "method": "model vision", "requires_review": true}}, "f_ba17e2c1bef7963c": {"value": ["Residential / Multifamily \u2014 Favored", "\u2022 A widening own-versus-rent affordability gap supports durable rental demand (exhibit).", "\u2022 Record new deliveries are peaking and set to taper, easing rent pressure.", "\u2022 A key area of interest for new capital deployment."], "source": {"file": "market_outlook_4Q25.pptx", "slide": 8}}, "f_8838ad19fd46bc56": {"value": null, "source": {"file": "market_outlook_4Q25.pptx", "slide": 8, "chart": 1, "asset": "assets/slide_8_chart_1.png", "method": "model vision", "requires_review": true}}, "f_c9faeb3bfbba1c4b": {"value": ["Office \u2014 Underweight", "\u2022 Transaction cap rates have repriced sharply higher \u2014 well above appraisal marks (exhibit).", "\u2022 A pronounced bifurcation persists; only best-in-class, well-located assets are favored.", "\u2022 Leasing is improving off a low base, but the recovery is uneven."], "source": {"file": "market_outlook_4Q25.pptx", "slide": 9}}, "f_a9cf247c7c653d9c": {"value": null, "source": {"file": "market_outlook_4Q25.pptx", "slide": 9, "chart": 1, "asset": "assets/slide_9_chart_1.png", "method": "model vision", "requires_review": true}}, "f_7906111b3af6a8d8": {"value": ["Retail \u2014 Selective", "\u2022 Years of minimal new supply against steady population growth have tightened availability, especially in the Sun Belt (exhibit).", "\u2022 Grocery-anchored and necessity-based formats are favored for resilient cash flows.", "\u2022 Discretionary and enclosed-mall formats remain out of favor."], "source": {"file": "market_outlook_4Q25.pptx", "slide": 10}}, "f_a668b1ffdb4bc05e": {"value": null, "source": {"file": "market_outlook_4Q25.pptx", "slide": 10, "chart": 1, "asset": "assets/slide_10_chart_1.png", "method": "model vision", "requires_review": true}}, "f_037f806a00f867b8": {"value": ["Private Real Estate Debt \u2014 Opportunistic", "\u2022 Reduced bank lending has widened spreads, creating selective opportunities in senior and mezzanine credit.", "\u2022 Relevant for dedicated debt mandates; not a focus of core / value-add equity portfolios."], "source": {"file": "market_outlook_4Q25.pptx", "slide": 11}}, "f_0993143bfbfcfdff": {"value": ["Risks We Are Monitoring", "\u2022 A resurgence in rate volatility could re-widen bid-ask spreads and stall the transaction recovery.", "\u2022 Refinancing of 2020\u20132021 vintage debt at higher rates remains a sector-wide overhang, most acute in office.", "\u2022 Slower-than-expected supply absorption in select multifamily submarkets."], "source": {"file": "market_outlook_4Q25.pptx", "slide": 12}}, "f_f7fec8895394ab59": {"value": ["Positioning Summary", "\u2022 Maintain leverage discipline; prefer moderate loan-to-value.", "\u2022 Tilt toward industrial / logistics and multifamily; underweight office; be selective in retail.", "\u2022 Deploy patiently into the recovery as pricing stabilizes."], "source": {"file": "market_outlook_4Q25.pptx", "slide": 13}}, "f_736e4d7841ba51c9": {"value": "1Q24", "source": {"file": "allocation_history.xlsx", "sheet": "Al
