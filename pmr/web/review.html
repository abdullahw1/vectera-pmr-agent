<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PMR Review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #242b33; background: white; font: 14px Arial, sans-serif; }
    header { padding: 16px 24px; border-bottom: 1px solid #d9dfe5; display: flex; gap: 16px; align-items: center; justify-content: space-between; }
    h1 { font-size: 21px; margin: 0 0 6px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
    p { line-height: 1.5; overflow-wrap: anywhere; } a { color: #245878; }
    button { cursor: pointer; padding: 9px 12px; color: white; background: #1b2b49; border: 0; border-radius: 4px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.secondary { background: #edf0f3; color: #242b33; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #378bb5; outline-offset: 2px; }
    nav { padding: 12px 24px; border-bottom: 1px solid #d9dfe5; display: flex; flex-wrap: wrap; gap: 8px; }
    nav button[aria-selected="false"] { background: #edf0f3; color: #242b33; }
    main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(340px, 2fr); }
    article, aside { padding: 24px; min-width: 0; }
    aside { background: #f7f9fa; border-left: 1px solid #d9dfe5; }
    section { margin-bottom: 28px; } .block { padding: 8px 0; border-bottom: 1px solid #edf0f3; overflow: auto; cursor: pointer; }
    .block:hover { background: #f3f6f8; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #d9dfe5; overflow-wrap: anywhere; }
    th { background: #1b2b49; color: white; }
    img { max-width: 100%; height: auto; }
    .issue, .fact { padding: 12px 0; border-bottom: 1px solid #d9dfe5; }
    .blocker { border-left: 3px solid #b03434; padding-left: 12px; }
    .warning { border-left: 3px solid #bc8534; padding-left: 12px; }
    .ok { color: #287454; } .muted { color: #606c75; font-size: 12px; }
    label { display: block; margin: 12px 0; } input[type="text"], textarea { width: 100%; padding: 9px; border: 1px solid #aab4be; border-radius: 3px; font: inherit; }
    input[type="number"] { width: 110px; max-width: 100%; padding: 7px; border: 1px solid #aab4be; }
    textarea { min-height: 85px; } .json { min-height: 160px; font: 12px monospace; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
    summary { cursor: pointer; padding: 8px 0; } .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #feedback { min-height: 24px; } #gate { font-size: 13px; }
    .review-flow { padding: 14px 24px; background: #eef5f2; border-bottom: 1px solid #d9dfe5; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .review-flow p { margin: 0; } .run-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 12px; font-size: 12px; }
    .run-summary dt { color: #606c75; } .run-summary dd { margin: 0; overflow-wrap: anywhere; }
    @media(max-width: 850px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid #d9dfe5; } header { align-items: flex-start; flex-direction: column; } article, aside, header, nav { padding: 16px; } }
  </style>
</head>
<body>
  <header><div><h1 id="title"></h1><span id="status" aria-live="polite"></span></div><div class="actions"><a href="report.pdf" target="_blank">Open draft PDF</a><a id="final" href="final_report.pdf" target="_blank" hidden>Open approved PDF</a></div></header>
  <div class="review-flow"><p id="next-step" aria-live="polite"></p><button id="continue-review">Confirm chart values</button></div>
  <nav role="tablist" aria-label="Review views"><button role="tab" data-view="report" aria-selected="true">1. Review Report</button><button role="tab" data-view="charts" aria-selected="false" id="charts-tab">2. Confirm Charts</button><button role="tab" data-view="issues" aria-selected="false" id="issues-tab">3. Warnings &amp; Approval</button></nav>
  <main><article id="report"></article><aside>
    <h2>Evidence &amp; Corrections</h2><div id="evidence">Select a paragraph or table cell to inspect its sources.</div>
    <h2>Verification</h2><div id="checks"></div><!--DIAGNOSTICS-->
    <h2>Release Approval</h2><p id="gate" aria-live="polite"></p>
    <label>Reviewer name<input id="reviewer" type="text" autocomplete="name"></label>
    <label><input id="ack" type="checkbox"> I reviewed the PDF, source evidence, chart values, and all warnings.</label>
    <button id="approve" disabled>Approve &amp; Download Final PDF</button><p id="feedback" role="status" aria-live="polite"></p>
    <p class="muted">Draft <span id="draft-id"></span></p>
  </aside></main>
  <script>
    const D = __PAYLOAD__;
    const el = id => document.getElementById(id);
    const esc = x => String(x ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
    const confirmed = new Set(), corrections = {}, edits = {}, reasons = {}, charts = D.data.charts;
    const blockers = D.ledger.issues.filter(i => i.severity === "blocker");
    const warnings = D.ledger.issues.filter(i => i.severity === "warning");
    let view = "report", chartIndex = 0, approved = false, pending = false, reviewRequired = false, editing;
    el("title").textContent = `${D.data.client} / ${D.data.quarter} Review`;
    el("draft-id").textContent = D.draft_hash.slice(0, 12);
    const checks = D.ledger.checks.filter(c => c.severity === "blocker");
    el("checks").textContent = `${checks.filter(c => c.passed).length} / ${checks.length} critical checks passed`;
    function updateGate() {
      const remaining = charts.filter(c => !confirmed.has(c.id)).length;
      el("charts-tab").textContent = `2. Confirm Charts (${confirmed.size}/${charts.length})`;
      el("issues-tab").textContent = `3. Warnings & Approval (${warnings.length} warnings)`;
      el("next-step").textContent = approved ? "Final report saved. Use Download final PDF to get another copy." : blockers.length ? `${blockers.length} blocking issue(s) need corrected inputs before approval.` : remaining ? `Review the report, then compare and confirm ${remaining} remaining chart(s) against their source images.` : "Charts confirmed. Review warnings, enter your name and acknowledge the report to approve.";
      el("continue-review").textContent = approved ? "Download final PDF" : blockers.length ? "Review blocking issues" : remaining ? "Confirm chart values" : "Review warnings & approve";
      if (reviewRequired) {
        el("next-step").textContent = "Your corrections created a new draft. Reload it and review again before approval.";
        el("continue-review").textContent = "Review corrected draft";
      }
      el("status").textContent = approved ? "Approved" : blockers.length ? "Blocked - source corrections required" : remaining ? "Draft - chart review required" : "Draft - ready for final review";
      const tasks = [];
      if (blockers.length) tasks.push(`${blockers.length} blocker(s) must be fixed and the report regenerated.`);
      if (remaining) tasks.push(`${remaining} chart(s) still need confirmation.`);
      if (!el("reviewer").value.trim()) tasks.push("Enter your reviewer name.");
      if (!el("ack").checked) tasks.push("Review the PDF and warnings, then acknowledge below.");
      el("gate").textContent = approved ? "Approval saved. The final PDF is available above." : tasks.join(" ") || "All review requirements are met.";
      el("approve").disabled = approved || pending || tasks.length > 0;
    }
    function sourceLabel(s) {
      return [s.file, s.sheet && `Sheet: ${s.sheet}`, s.cell && `Cell: ${s.cell}`, s.page && `Page ${s.page}`, s.slide && `Slide ${s.slide}`, s.row && `Row ${s.row}`, s.column && `Column ${s.column}`].filter(Boolean).join(" / ");
    }
    function show(ids) {
      const visited = new Set();
      function fact(id) {
        if (visited.has(id)) return ""; visited.add(id);
        const f = D.ledger.facts[id]; if (!f) return "";
        const s = f.source || {};
        return `<div class="fact"><h3>${esc(sourceLabel(s) || f.formula || id)}</h3><p>${esc(typeof f.value === "object" ? JSON.stringify(f.value) : f.value)}</p>${s.quote ? `<blockquote>${esc(s.quote)}</blockquote>` : ""}<details><summary>Audit details</summary><pre>${esc(JSON.stringify(f, null, 2))}</pre></details></div>` + (f.inputs || []).map(fact).join("");
      }
      el("evidence").innerHTML = ids.map(fact).join("") || "No source value is asserted in this item.";
    }
    function renderReport() {
      el("report").innerHTML = D.sections.map(s => `<section><h2>${esc(s.title)}</h2>${s.blocks.map(b => {
        const ids = esc(JSON.stringify(b.evidence || []));
        if (b.type === "paragraph") return `<div class="block" data-evidence="${ids}"><p>${esc(b.text)}</p></div>`;
        if (b.type === "chart") return `<div class="block" data-evidence="${ids}"><img alt="${esc(b.kind)}" src="assets/${esc(b.kind)}.png"></div>`;
        return `<div class="block"><table><thead><tr>${b.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r, ri) => `<tr>${r.map((c, ci) => `<td data-evidence="${esc(JSON.stringify(b.cell_evidence?.[ri]?.[ci] || b.evidence || []))}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      }).join("")}</section>`).join("");
    }
    function renderCharts() {
      if (!charts.length) { el("report").innerHTML = "<h2>No chart extractions available</h2><p>Inspect Issues before approval.</p>"; return; }
      const c = charts[chartIndex]; editing = JSON.parse(JSON.stringify(edits[c.id] || corrections[c.id]?.data || c.data));
      el("report").innerHTML = `<div class="actions"><button class="secondary" id="previous" ${chartIndex === 0 ? "disabled" : ""}>Previous chart</button><span>Chart ${chartIndex + 1} of ${charts.length}</span><button class="secondary" id="next" ${chartIndex === charts.length - 1 ? "disabled" : ""}>Next chart</button></div><h2>${esc(editing?.title || "Extraction unavailable")}</h2><p>${esc(sourceLabel(D.ledger.facts[c.id]?.source || {}))}</p><img src="${esc(c.asset)}" alt="Source chart for visual verification">`;
      el("previous").onclick = () => { chartIndex--; renderCharts(); }; el("next").onclick = () => { chartIndex++; renderCharts(); };
      if (!editing || !Array.isArray(editing.series) || !editing.series.length) { el("evidence").textContent = "Chart extraction unavailable. Resolve the blocker and regenerate; confirmation cannot replace an extraction."; return; }
      el("evidence").innerHTML = `<h3>${confirmed.has(c.id) ? "Confirmed" : "Awaiting confirmation"}</h3><table><thead><tr><th>Period / Series</th><th>Value</th><th>Reading</th></tr></thead><tbody>${editing.series.map((r, i) => `<tr><td>${esc(r.label)}<br>${esc(r.series)}</td><td><input type="number" step="any" data-value="${i}" aria-label="${esc(r.label + ' ' + r.series)}" value="${esc(r.value)}"> ${esc(r.unit)}</td><td>${esc(r.method || "label")}${r.precision ? `<br>Precision: ${esc(r.precision)}` : ""}</td></tr>`).join("")}</tbody></table><label>Correction reason<textarea id="reason" placeholder="If changed: cite the visible label or gridline.">${esc(corrections[c.id]?.reason || "")}</textarea></label><details><summary>Advanced: labels, units and extraction JSON</summary><textarea id="chart-json" class="json">${esc(JSON.stringify(editing, null, 2))}</textarea><button class="secondary" id="apply-json">Apply JSON edits</button></details><button id="confirm-chart">Confirm These Chart Values</button><p id="chart-feedback" role="status"></p>`;
      if (reasons[c.id] !== undefined) el("reason").value = reasons[c.id];
      function changed() { confirmed.delete(c.id); reasons[c.id] = el("reason").value; el("ack").checked = false; updateGate(); }
      el("evidence").querySelectorAll("[data-value]").forEach(input => input.oninput = () => {
        editing.series[Number(input.dataset.value)].value = input.value === "" ? null : Number(input.value);
        edits[c.id] = editing;
        el("chart-json").value = JSON.stringify(editing, null, 2); changed();
      });
      el("chart-json").oninput = changed; el("reason").oninput = changed;
      el("apply-json").onclick = () => {
        try { const value = JSON.parse(el("chart-json").value); validateValues(value); edits[c.id] = value; changed(); renderCharts(); }
        catch (error) { el("chart-feedback").textContent = error.message; }
      };
      el("confirm-chart").onclick = () => {
        try {
          const value = JSON.parse(el("chart-json").value); validateValues(value);
          if (JSON.stringify(value) !== JSON.stringify(c.data)) {
            const reason = el("reason").value.trim(); if (!reason) throw Error("Enter a correction reason before confirming changed values.");
            corrections[c.id] = {data:value, reason};
          } else delete corrections[c.id];
          confirmed.add(c.id); updateGate();
          const next = charts.findIndex(chart => !confirmed.has(chart.id));
          if (next >= 0) { chartIndex = next; renderCharts(); } else { switchView("issues"); el("evidence").textContent = "All charts confirmed. Review warnings, then complete Release Approval below."; }
        } catch (error) { el("chart-feedback").textContent = error.message; }
      };
    }
    function validateValues(v) {
      if (!v || !Array.isArray(v.series) || !v.series.length || v.series.some(r => typeof r.value !== "number" || !Number.isFinite(r.value) || !r.label || !r.series || !r.unit)) throw Error("Every observation needs a label, series, unit and finite numeric value.");
    }
    function renderIssues() {
      el("report").innerHTML = ["blocker", "warning", "review"].map(severity => `<section><h2>${{blocker:"Blockers - fix inputs and regenerate", warning:"Warnings - inspect before approval", review:"Chart confirmations"}[severity]}</h2>${D.ledger.issues.filter(i => i.severity === severity).map(i => `<div class="issue ${esc(severity)}"><strong>${esc(confirmed.has(i.fact_id) ? "CONFIRMED" : i.code)}</strong><p>${esc(i.message)}</p>${i.fact_id && charts.some(c => c.id === i.fact_id) ? `<button data-chart="${esc(i.fact_id)}">Review chart</button>` : i.evidence?.length ? `<button data-evidence="${esc(JSON.stringify(i.evidence))}">Inspect evidence</button>` : ""}</div>`).join("") || "<p>None.</p>"}</section>`).join("");
    }
    function switchView(next) {
      view = next; document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
      if (view === "charts") renderCharts(); else if (view === "issues") renderIssues(); else renderReport();
    }
    function downloadFinal() {
      const link = document.createElement("a"); link.href = el("final").href;
      link.download = el("final").download || `${D.data.client}_PMR_${D.data.quarter}.pdf`;
      document.body.appendChild(link); link.click(); link.remove();
    }
    el("continue-review").onclick = () => {
      if (reviewRequired) { location.href = "review.html"; return; }
      if (approved) return downloadFinal();
      if (blockers.length) return switchView("issues");
      const next = charts.findIndex(chart => !confirmed.has(chart.id));
      if (next >= 0) { chartIndex = next; switchView("charts"); }
      else { switchView("issues"); el("reviewer").focus(); }
    };
    window.addEventListener("message", event => {
      if (event.origin === location.origin && event.source === window.parent && event.data?.type === "pmr-review-view" && ["report", "charts", "issues"].includes(event.data.view)) {
        switchView(event.data.view);
      }
    });
    document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => switchView(b.dataset.view));
    el("report").onclick = event => {
      const evidence = event.target.closest("[data-evidence]"); if (evidence) show(JSON.parse(evidence.dataset.evidence));
      const chart = event.target.closest("[data-chart]"); if (chart) { chartIndex = charts.findIndex(c => c.id === chart.dataset.chart); switchView("charts"); }
    };
    el("reviewer").oninput = updateGate; el("ack").onchange = updateGate;
    el("approve").onclick = async () => {
      if (el("approve").disabled) return; pending = true; updateGate(); el("feedback").textContent = "Validating review and creating final PDF...";
      try {
        const response = await fetch("approve", {method:"POST", headers:{"Content-Type":"application/json", "X-PMR-Token":window.PMR_CSRF || ""}, body:JSON.stringify({draft_hash:D.draft_hash, reviewer:el("reviewer").value.trim(), acknowledged:el("ack").checked, confirmed_charts:[...confirmed], corrections})});
        const result = await response.json(); el("feedback").textContent = result.message;
        if (response.ok && result.status === "review_required") {
          reviewRequired = true;
          confirmed.clear(); el("ack").checked = false;
          el("feedback").appendChild(Object.assign(document.createElement("a"), {href:"review.html", textContent:" Reload corrected draft"}));
          pending = true;
          el("approve").hidden = true;
        } else if (response.ok && result.status === "approved") {
          approved = true; el("final").hidden = false;
          if (result.report_filename) el("final").href = encodeURIComponent(result.report_filename);
          el("final").download = result.report_filename || `${D.data.client}_PMR_${D.data.quarter}.pdf`;
          el("final").textContent = "Download final PDF"; downloadFinal();
        }
      } catch (error) { el("feedback").textContent = "Approval was not saved. Open review through the running PMR server and retry."; }
      finally { pending = false; updateGate(); }
    };
    renderReport(); updateGate();
  </script>
</body>
</html>
